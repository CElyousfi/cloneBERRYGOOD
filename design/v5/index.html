<!DOCTYPE html>
<html lang="fr">
<head>

    </div>
    <div class="ls" id="navls"></div>

            <h1 id="scr">—</h1>
            <span class="sp"></span>
            <span class="hint">Application Smart BERRY — fonctionnalités d'origine</span>
          </div>
          <iframe class="frame" id="frame" title="Smart BERRY"></iframe>

<div class="ribbon"><span class="d"></span>Interface v5</div>
