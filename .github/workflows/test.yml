# CI de test Smart Berry — lint, typage, tests unitaires et build sur chaque push/PR.
# Indépendant des 2 workflows cron existants (fetch-fuel-data, fetch-telecom-data).
# Node 20 = version des Cloud Functions (functions/package.json engines).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (functions)
        run: npm ci
        working-directory: functions

      # Analyse syntaxique de tous les fichiers suivis (scripts/lint.cjs).
      # Absent de la CI jusqu'ici : une faute de syntaxe ne se voyait qu'au build.
      - name: Lint (syntaxe)
        run: npm run lint

      # Vert depuis la reprise des annotations JSDoc. Bloquant à dessein : la
      # cible n'a de valeur que si une régression la fait échouer.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires frontend
        run: npm run test:unit

      - name: Tests backend (lib/*/__tests__)
        run: npm run test:all
        working-directory: functions

      - name: Build frontend (Vite → public/)
        run: npm run build

      # Toute référence libre de src/modules doit se résoudre. C'est ce qui
      # rattrape un import oublié après un découpage ou un déplacement de
      # fichier — le risque principal maintenant que le tree modulaire évolue.
      - name: Références du tree modulaire
        run: npm run verify:refs
