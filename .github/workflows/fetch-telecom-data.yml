name: Fetch Telecom Data

on:
  schedule:
    # Scrape quotidien à 08:00 Maroc — capte la nouvelle facture dès publication
    # et reste à jour si IAM met à jour des données existantes.
    - cron: '0 7 * * *'   # 07:00 UTC = 08:00 Maroc
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

jobs:
  fetch-telecom:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install dotenv playwright

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env
        run: |
          echo "IAM_USERNAME=${{ secrets.IAM_USERNAME }}" > .env
          echo "IAM_PASSWORD=${{ secrets.IAM_PASSWORD }}" >> .env

      - name: Fetch telecom data & import to Firestore
        run: node scripts/fetch-telecom-data.js
        env:
          IAM_USERNAME: ${{ secrets.IAM_USERNAME }}
          IAM_PASSWORD: ${{ secrets.IAM_PASSWORD }}
          TELECOM_IMPORT_KEY: ${{ secrets.TELECOM_IMPORT_KEY }}

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telecom-data-${{ github.run_id }}
          path: data/
          retention-days: 30
